[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Development tasks for ochco: downloading models and packaging releases"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1"
sha2 = "0.11"
tar = "0.4"
ureq = "3.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[lints]
workspace = true
