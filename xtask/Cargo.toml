[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Development tasks for peekr: downloading models, rendering the icon and packaging releases"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
resvg = { version = "0.48", default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tar = "0.4"
toml = "1"
ureq = "3.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[lints]
workspace = true
