name: Release

# Push a tag matching the crate version (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build
# the release for every platform with Velopack and attach it to a draft GitHub release.
#
# The release also carries Velopack's packages and feeds, which installed copies update from. They
# only see them once the draft is published, as `releases/latest` skips drafts and pre-releases.
#
# Run the workflow manually (Actions > Release > Run workflow) to only build: the files are kept
# as artifacts of the run, and no release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is no reason to skip the checks, and a release is every reason not to: nothing is built
  # until they pass, so a tag can never turn into a release the tests would have stopped.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: checks
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          # The prebuilt ONNX Runtime links against glibc 2.38 symbols, so Ubuntu 24.04 is the
          # oldest usable runner (and the minimum for users).
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev libxcb1-dev libxcb-randr0-dev \
            libegl-dev libgbm-dev libwayland-dev

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Restore models
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('xtask/src/models.rs') }}

      - name: Download models
        run: cargo xtask models

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # The same version as the velopack crate the app is built with, which is what Velopack
      # expects: the packages vpk makes are read by that crate.
      - name: Install vpk
        shell: bash
        run: |
          version=$(tr -d '\r' < Cargo.lock | grep -A1 '^name = "velopack"$' | sed -n 's/^version = "\(.*\)"$/\1/p')
          dotnet tool install --global vpk --version "$version"

      - name: Build the release
        env:
          # For fetching the latest release to make the delta from, without the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask dist

      - uses: actions/upload-artifact@v7
        with:
          name: peekr-${{ matrix.platform }}
          path: target/dist/release/*
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes
