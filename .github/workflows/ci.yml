name: CI

# Changes that only touch documentation do not affect the build.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CLAUDE.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - CLAUDE.md
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting does not depend on the platform, so it runs once, without system libraries or a
  # build cache, and reports within seconds.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev libxcb1-dev libxcb-randr0-dev \
            libegl-dev libgbm-dev libwayland-dev

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
