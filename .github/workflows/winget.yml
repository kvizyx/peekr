name: winget

# Submits a pull request to microsoft/winget-pkgs when a release is published, so
# `winget upgrade peekr` picks up the new version.
#
# Needs a WINGET_TOKEN secret: a classic personal access token with the `public_repo` scope from an
# account that has forked microsoft/winget-pkgs. Without it the job just reports that it skipped.
# The very first version has to be submitted by hand; see the README.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: Version to submit, e.g. 0.1.1
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit the manifests
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN is not set; skipping the winget submission"
            exit 0
          }

          $version = $env:VERSION -replace '^v', ''
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/peekr-$version-windows-x86_64-setup.exe"

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update kvizyx.Peekr --version $version --urls $url --submit --token $env:WINGET_TOKEN
